# §17.1075 — Alembic for NEW schema changes. db/migrations/*.sql stays the
# history (applied by app/migrations.py first); revisions here run after it at
# startup (alembic upgrade head) and via `make migrate`. Multi-statement
# migrations are fine here — the single-statement rule was the custom runner's.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# the URL comes from settings.database_url at runtime (alembic/env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
