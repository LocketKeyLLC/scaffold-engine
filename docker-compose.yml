# Scaffold Engine — Docker Compose
# Milvus runs in compose with ETCD_USE_EMBED=true (standalone, no external etcd/minio).
# Ollama is HOST-installed — reachable at 172.18.0.1:11434
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:b80a96e14bb15ea79aec96fbdad4aeab6b3ee7b61520d83b5dbc8c4f47d433a9
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://172.18.0.1:11434
      - OPENAI_API_BASE_URLS=http://pipelines:9099
      - OPENAI_API_KEYS=0p3n-w3bu!
      - RESET_CONFIG_ON_START=true
      - USE_OLLAMA_DOCKER=false
      - WEBUI_SECRET_KEY=
      - AIOHTTP_CLIENT_TIMEOUT=7200
      - DEFAULT_MODELS=scaffold_router
    volumes:
      - open-webui:/app/backend/data
    restart: always
    networks:
      - ai-network
  pipelines:
    image: ghcr.io/open-webui/pipelines@sha256:b48e9bc338ce2be0acfbeff01810db72408a12f07739f9e3879c1f2b00952d6e
    container_name: open-webui-pipelines
    ports:
      - "9099:9099"
    volumes:
      - ./pipelines:/app/pipelines
    restart: always
    networks:
      - ai-network
  searxng:
    image: searxng/searxng@sha256:b6db575bb821d35279474090270db9e53e92432a66d19e7da51c0ef1b5ddb806
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - /home/aedefruscio/searxng:/etc/searxng
    restart: always
    networks:
      - ai-network
  scaffold-postgres:
    image: postgres:16
    container_name: scaffold-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scaffold_engine
      POSTGRES_USER: ${POSTGRES_USER:-scaffold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scaffold_dev_pw}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scaffold} -d scaffold_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - ai-network
  scaffold-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scaffold-orchestrator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scaffold}:${POSTGRES_PASSWORD:-scaffold_dev_pw}@scaffold-postgres:5432/scaffold_engine
      OLLAMA_BASE_URL: http://172.18.0.1:11434
      MILVUS_URI: http://milvus-standalone:19530
      SEARXNG_URL: http://searxng:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON_FORMAT: "true"
      LOG_FILE: /var/log/scaffold/app.jsonl
      MODEL_ROUTER: qwen3:4b
      PYTHONPATH: /code
      MODEL_EMBEDDER_PIPELINE: qwen3-embedding:8b
      MODEL_RERANKER: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
      MODEL_CODER: qwen2.5-coder:7b
      MODEL_GENERAL: qwen3-vl:235b-instruct-cloud
      MODEL_VERIFIER: qwen2.5:7b
      MODEL_CLOUD_HEAVY: qwen3-vl:235b-instruct-cloud
      MODEL_CLOUD_ALT: qwen3.5:397b-cloud
      MODEL_FALLBACK: qwen3.5:latest
      CLOUD_TIMEOUT: "600"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MAX_FILES: "50"
      GITHUB_TIMEOUT: "30"
      LOCAL_TIMEOUT: "1800"
      HF_HOME: /code/.cache/huggingface
      MAX_RETRIES: "3"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
      SCAFFOLD_API_KEY: "${SCAFFOLD_API_KEY}"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TIMEZONE: "UTC"
      SCHEDULER_JOBSTORE_URL: "postgresql+psycopg2://scaffold:scaffold_dev_pw@scaffold-postgres:5432/scaffold_engine"
    volumes:
      - ./app:/code/app:ro
      - ./ground_truths:/code/ground_truths:ro
      - hf-cache:/code/.cache/huggingface
      - scaffold-logs:/var/log/scaffold
    restart: unless-stopped
    networks:
      - ai-network
    depends_on:
      scaffold-postgres:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      scaffold-redis:
        condition: service_healthy
  milvus-standalone:
    image: milvusdb/milvus:v2.5.27@sha256:ea3b924dfb2129fa2daca569eab657b4fcebc4baaed5706cf30d51e19d99b0c9
    container_name: milvus-standalone
    command: milvus run standalone
    environment:
      - ETCD_USE_EMBED=true
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus-data-v2:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai-network
  scaffold-redis:
    image: redis:8-alpine
    container_name: scaffold-redis
    command: >
      redis-server --save 60 1000
      --loglevel warning --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ai-network:
    external: true
    name: ai-network

volumes:
  open-webui:
    external: true
    name: open-webui
  postgres-data:
    name: scaffold-postgres-data
  hf-cache:
  scaffold-logs:
  redis-data:
  milvus-data-v2:
    external: true
    name: milvus-data-v2
