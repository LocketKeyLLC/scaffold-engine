# Scaffold Engine — Docker Compose
# Milvus runs in compose with ETCD_USE_EMBED=true (standalone, no external etcd/minio).
# Ollama is HOST-installed — reachable at 172.18.0.1:11434
#
# Hardening posture (X.28, 2026-05-09):
#   - scaffold-orchestrator runs as scaffold:scaffold (UID/GID 10001), see Dockerfile.
#   - postgres + redis run as their image's app user (999); cap_drop: ALL is safe there.
#   - pipelines runs as host UID 1000 so writes to ./pipelines (still required for OWUI
#     valve UI persistence) land as the host user, not root. The five top-level pipeline
#     .py files are additionally mounted :ro per-file so an inside-container compromise
#     cannot rewrite the executable code on the host.
#   - searxng's host config dir is now :ro — settings.yml is never written by the
#     container. user matches the image's searxng UID (977).
#   - open-webui + milvus stay as image defaults (root) — adding cap_drop ALL is known
#     to break their entrypoints. They get no-new-privileges defense-in-depth only.
#   - Existing scaffold-engine_{hf-cache,scaffold-logs} volumes were created when the
#     orchestrator ran as root; run scripts/chown_named_volumes.sh once after pull
#     before the first non-root deploy, otherwise the orchestrator cannot write logs
#     or the HF cache.
#
# §17.97 — log rotation. Docker's default json-file driver has no size
# cap; on a long-running deployment the orchestrator's per-request log
# lines can fill /var/lib/docker over weeks. The anchor below caps each
# container at 30 MB × 5 files = 150 MB total per service before rolling.
# Apply per-service via `<<: *default-logging`.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "30m"
    max-file: "5"

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:b80a96e14bb15ea79aec96fbdad4aeab6b3ee7b61520d83b5dbc8c4f47d433a9
    container_name: open-webui
    logging: *default-logging
    # §17.93 — bind to loopback only. Internal container traffic still
    # reaches OWUI via the ai-network bridge DNS (`open-webui:8080`);
    # external access is operator-only via http://127.0.0.1:3000 or an
    # explicit SSH/reverse-proxy hop.
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://172.18.0.1:11434
      - OPENAI_API_BASE_URLS=http://pipelines:9099
      - OPENAI_API_KEYS=${OPENWEBUI_PIPELINES_KEY:?OPENWEBUI_PIPELINES_KEY is required}
      - RESET_CONFIG_ON_START=false
      - USE_OLLAMA_DOCKER=false
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is required}
      - DEFAULT_MODELS=scaffold_router
    env_file:
      - .env
    volumes:
      - open-webui:/app/backend/data
    security_opt:
      - no-new-privileges:true
    restart: always
    networks:
      - ai-network
  pipelines:
    image: ghcr.io/open-webui/pipelines@sha256:b48e9bc338ce2be0acfbeff01810db72408a12f07739f9e3879c1f2b00952d6e
    container_name: open-webui-pipelines
    logging: *default-logging
    # §17.93 — bind to loopback only. OWUI reaches pipelines via the
    # bridge (`http://pipelines:9099` in OWUI's OPENAI_API_BASE_URLS).
    ports:
      - "127.0.0.1:9099:9099"
    # Match host UID 1000 so the bind-mounted ./pipelines/<name>/valves.json
    # writes (driven by the OWUI valve UI) land as the host user instead of
    # root. The image runs as root by default; pinning user: here is the
    # only way to neutralize the "container escape rewrites valves.json as
    # root" half of the threat. See per-file :ro mounts below for the
    # other half — the executable .py code.
    user: "1000:1000"
    environment:
      - PIPELINES_API_KEY=${OPENWEBUI_PIPELINES_KEY:?OPENWEBUI_PIPELINES_KEY is required}
      # Forwarded to pipeline _apply_env_fallbacks so a wiped valves.json
      # can recover api_key/url/ollama from env. Without these the 4 non-
      # router pipelines silently use baked-in defaults after rotation.
      - SCAFFOLD_API_KEY=${SCAFFOLD_API_KEY:?SCAFFOLD_API_KEY is required}
      - SCAFFOLD_ORCHESTRATOR_URL=${SCAFFOLD_ORCHESTRATOR_URL:-http://scaffold-orchestrator:8000}
      - SCAFFOLD_OLLAMA_URL=${SCAFFOLD_OLLAMA_URL:-http://172.18.0.1:11434}
      # When true, .env beats valves.json for managed string fields
      # (api_key, orchestrator_url, ollama_url) — eliminates rotation
      # drift. Default false preserves OWUI valve UI as source of truth.
      - SCAFFOLD_VALVES_ENV_OVERRIDE=${SCAFFOLD_VALVES_ENV_OVERRIDE:-false}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9099/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # The pipelines tree as a whole stays bind-mounted so OWUI's valve
      # UI can persist <name>/valves.json. Per-file :ro overlays below
      # then re-protect the actual executable code so a compromised
      # pipeline cannot rewrite its own .py on the host.
      - ./pipelines:/app/pipelines
      - ./pipelines/scaffold_router.py:/app/pipelines/scaffold_router.py:ro
      - ./pipelines/dag_viewer.py:/app/pipelines/dag_viewer.py:ro
      - ./pipelines/execution_handler.py:/app/pipelines/execution_handler.py:ro
      - ./pipelines/gt_browser.py:/app/pipelines/gt_browser.py:ro
      - ./pipelines/prompt_inspector.py:/app/pipelines/prompt_inspector.py:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: always
    networks:
      - ai-network
  searxng:
    image: searxng/searxng@sha256:b6db575bb821d35279474090270db9e53e92432a66d19e7da51c0ef1b5ddb806
    container_name: searxng
    logging: *default-logging
    # §17.93 — bind to loopback only. The orchestrator reaches SearXNG
    # via the bridge (`http://searxng:8080`).
    ports:
      - "127.0.0.1:8888:8080"
    # 977 is the searxng user baked into the upstream image and matches
    # the existing host /home/aedefruscio/searxng/settings.yml ownership.
    user: "977:977"
    volumes:
      # :ro — searxng never writes its own config. The previous rw mount
      # left settings.yml host-rewritable from inside the container.
      - /home/aedefruscio/searxng:/etc/searxng:ro
      # Named cache volume so the upstream image's `VOLUME /var/cache/searxng`
      # instruction doesn't auto-create a new anonymous volume on every
      # `compose up`. Cache content is non-essential (runtime query cache)
      # but persisting it across restarts is harmless and avoids the
      # dangling-volume cruft the audit pass M5 flagged.
      - searxng-cache:/var/cache/searxng
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: always
    networks:
      - ai-network
  scaffold-postgres:
    image: postgres:16@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
    container_name: scaffold-postgres
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    # 999 is the postgres uid/gid baked into the image and matches the
    # existing scaffold-postgres-data volume ownership. Skipping the
    # entrypoint root drop avoids needing CAP_SETUID/SETGID/CHOWN.
    user: "999:999"
    environment:
      POSTGRES_DB: scaffold_engine
      POSTGRES_USER: ${POSTGRES_USER:-scaffold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scaffold} -d scaffold_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: always
    networks:
      - ai-network
  scaffold-orchestrator:
    # Deterministic local tag so a Dockerfile / source change doesn't
    # silently rebuild on `docker compose up -d`. Compose only rebuilds
    # when the tag is missing or `--build` is passed; `make build` is
    # the explicit gate. Override SCAFFOLD_IMAGE_TAG in .env (or push
    # a registry-tagged build) when graduating to a real prod deploy.
    image: scaffold-engine:${SCAFFOLD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: scaffold-orchestrator
    logging: *default-logging
    # §17.93 — bind to loopback only. The API surface is operator-only;
    # `/web/*`, `/health`, `/metrics`, `/` are auth-exempt and shouldn't
    # be reachable from the LAN. Other containers reach the orchestrator
    # via the bridge (`http://scaffold-orchestrator:8000`).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scaffold}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@scaffold-postgres:5432/scaffold_engine
      OLLAMA_BASE_URL: http://172.18.0.1:11434
      MILVUS_URI: http://milvus-standalone:19530
      SEARXNG_URL: http://searxng:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON_FORMAT: "true"
      LOG_FILE: /var/log/scaffold/app.jsonl
      MODEL_ROUTER: qwen3:4b
      # PYTHONPATH=/code:/code/sdk is now image-intrinsic (Dockerfile),
      # so it does not need to be re-declared here.
      # qwen3-embedding:8b on Ollama 0.17.5 wedged deterministically on this
      # host's --ollama-engine path (audit Findings B+C, §17.81/82). Switched
      # to nomic-embed-text: 137M params (50× smaller), 768-dim native →
      # MRL-truncated to 512 by truncate_and_normalize, ~1s warm on CPU.
      MODEL_EMBEDDER_PIPELINE: nomic-embed-text
      MODEL_RERANKER: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
      MODEL_CODER: qwen2.5-coder:7b
      MODEL_GENERAL: qwen3-vl:235b-instruct-cloud
      MODEL_VERIFIER: qwen2.5:7b
      MODEL_CLOUD_ALT: qwen3.5:397b-cloud
      MODEL_FALLBACK: qwen3.5:latest
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MAX_FILES: "50"
      HF_HOME: /code/.cache/huggingface
      MAX_RETRIES: "3"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
      SCAFFOLD_API_KEY: "${SCAFFOLD_API_KEY:?SCAFFOLD_API_KEY is required (or set SCAFFOLD_AUTH_DISABLED=1)}"
      SCAFFOLD_AUTH_DISABLED: "${SCAFFOLD_AUTH_DISABLED:-0}"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TIMEZONE: "UTC"
    env_file:
      - .env
    volumes:
      # Prod runs strictly from baked image layers (Dockerfile `runtime`
      # stage COPYs app/, scripts/, db/, sdk/scaffold_client/, cli/scaffold_cli/).
      # Host-source bind mounts live in docker-compose.dev.yml only —
      # mounting them here would silently shadow the image with whatever
      # is on disk, defeating the multi-stage hermetic build, and would
      # cause Docker to auto-create any missing host paths as root:root.
      - hf-cache:/code/.cache/huggingface
      - scaffold-logs:/var/log/scaffold
    # Rootfs is read-only — application writes go to the two named
    # volumes above. /tmp is a small tmpfs because various libs (e.g.
    # huggingface_hub, pip caches indirectly via setuptools, asyncpg
    # certs unpacks) write transient files there.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # /health covers postgres + ollama + milvus + redis + reranker; ~43 ms warm.
      # start_period covers lifespan migrations + reranker prewarm + Milvus connect.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ai-network
    depends_on:
      scaffold-postgres:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      scaffold-redis:
        condition: service_healthy
  milvus-standalone:
    image: milvusdb/milvus:v2.5.27@sha256:ea3b924dfb2129fa2daca569eab657b4fcebc4baaed5706cf30d51e19d99b0c9
    container_name: milvus-standalone
    logging: *default-logging
    command: milvus run standalone
    environment:
      - ETCD_USE_EMBED=true
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus-data-v2:/var/lib/milvus
    # §17.93 — bind to loopback only. The orchestrator reaches Milvus
    # via the bridge (`http://milvus-standalone:19530`). Port 9091 is
    # Milvus's healthcheck endpoint, also operator-only.
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    # seccomp:unconfined is preserved — milvus's embedded etcd needs
    # syscalls (mmap/clone/etc) the default Docker seccomp profile
    # blocks. no-new-privileges is added on top: orthogonal to seccomp,
    # blocks setuid escalation paths inside the container.
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai-network
  scaffold-redis:
    image: redis:8-alpine@sha256:81b6f81d6a6c5b9019231a2e8eb10085e3a139a34f833dcc965a8a959b040b72
    container_name: scaffold-redis
    logging: *default-logging
    # 999:1000 is the redis user/group baked into redis:8-alpine.
    # /data is already chowned redis:redis in the existing volume.
    user: "999:1000"
    command: >
      redis-server --save 60 1000
      --loglevel warning --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: always
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  # §17.140 — ngspice sidecar. Isolates the ngspice CLI behind a small
  # FastAPI surface so untrusted SPICE input never executes inside the
  # orchestrator's process tree. The orchestrator reaches this service
  # over the ai-network bridge at http://scaffold-ngspice:8001; port
  # 8001 is bound to loopback for operator probing only.
  scaffold-ngspice:
    # Deterministic local tag — same pattern as scaffold-orchestrator.
    # `docker compose up -d` only rebuilds on missing tag or --build.
    image: scaffold-ngspice:${SCAFFOLD_NGSPICE_IMAGE_TAG:-local}
    build:
      context: ./docker/ngspice
      dockerfile: Dockerfile
    container_name: scaffold-ngspice
    logging: *default-logging
    ports:
      - "127.0.0.1:8001:8001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: always
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8001/health\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  # §17.141 — Verilator sidecar. Same isolation posture as ngspice; the
  # difference is that Verilator additionally needs to compile generated
  # C++ on every /run call (so g++/make are baked into the runtime image
  # and /tmp tmpfs is sized larger to hold obj_dir build artifacts).
  scaffold-verilator:
    image: scaffold-verilator:${SCAFFOLD_VERILATOR_IMAGE_TAG:-local}
    build:
      context: ./docker/verilator
      dockerfile: Dockerfile
    container_name: scaffold-verilator
    logging: *default-logging
    ports:
      - "127.0.0.1:8002:8002"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Docker's tmpfs defaults to `noexec` — but the verilator pipeline
    # builds and then EXECUTES a fresh binary in /tmp every /run call,
    # so we have to opt out. nosuid+nodev are still enforced; the only
    # privilege we restore is the ability to exec a freshly-compiled
    # binary owned by the same uid that compiled it.
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=256m
    restart: always
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8002/health\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  # §17.142 — SymbiYosys sidecar. Third ground-truth oracle (after
  # ngspice §17.140 + verilator §17.141). Formal verification: SV
  # assertions → SMT → PASS / FAIL / UNKNOWN. Toolchain comes from
  # the OSS CAD Suite pinned-tag tarball (yosys + sby + z3 + others,
  # all tested together by YosysHQ).
  scaffold-symbiyosys:
    image: scaffold-symbiyosys:${SCAFFOLD_SYMBIYOSYS_IMAGE_TAG:-local}
    build:
      context: ./docker/symbiyosys
      dockerfile: Dockerfile
    container_name: scaffold-symbiyosys
    logging: *default-logging
    ports:
      - "127.0.0.1:8003:8003"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # sby spawns yosys + the SMT solver as subprocesses and writes a
    # work/ tree of intermediate files. Tmpfs explicitly `exec` per
    # the §17.141 noexec-default lesson (and because some of those
    # solvers may exec helper binaries from /tmp).
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=512m
    restart: always
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8003/health\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ai-network:
    external: true
    name: ai-network

volumes:
  open-webui:
    external: true
    name: open-webui
  postgres-data:
    name: scaffold-postgres-data
  hf-cache:
  scaffold-logs:
  redis-data:
  searxng-cache:
  milvus-data-v2:
    external: true
    name: milvus-data-v2
