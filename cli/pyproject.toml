[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-engine-cli"
version = "0.3.0"
description = "Terminal client for Scaffold Engine. See OVERVIEW.md and USER_GUIDE.md in the source repo."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Scaffold Engine"}]
keywords = ["llm", "cli", "scaffold-engine"]
dependencies = [
    "click>=8.0,<9.0",
    "scaffold-engine-client>=1.2,<2.0",
]

[project.scripts]
scaffold = "scaffold_cli.main:cli"

[tool.setuptools]
packages = ["scaffold_cli"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
