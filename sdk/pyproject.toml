[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-engine-client"
version = "1.3.0"
description = "Typed Python client for the Scaffold Engine orchestrator HTTP API. See OVERVIEW.md and USER_GUIDE.md in the source repo."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Scaffold Engine"}]
keywords = ["llm", "scaffold-engine", "rag", "client", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25,<1.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/AEDeFruscio/scaffold-engine"

[tool.setuptools]
packages = ["scaffold_client"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
