# Dev override: targets the multi-stage Dockerfile's `dev` stage.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build scaffold-orchestrator
# Or set COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml in your shell.
services:
  scaffold-orchestrator:
    # Distinct tag from prod (scaffold-engine:local) so dev rebuilds
    # never clobber the prod-image tag. `make build-dev` is the
    # explicit gate that rebuilds + tags this image.
    image: scaffold-engine:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    # X.28: prod runs as scaffold (UID 10001). For dev we override to
    # the host UID/GID so the writable bench mount below can be written
    # without chmoding the host tree. Read-only mounts work for either
    # UID because the host repo is mode 775 (world-readable).
    user: "1000:1000"
    # X.28: prod is read_only with rootfs locked. Dev needs the rootfs
    # writable for pytest's tmp dirs, coverage, and ad-hoc poking, so
    # the override drops read_only.
    read_only: false
    # cap_drop: [ALL] is inherited from prod. Pytest does not exercise
    # syscalls that require extra caps (no raw sockets, no chown, no
    # privileged binds). If a future test does need a cap, add it here
    # via cap_add. Compose merges cap_add onto the inherited cap_drop.
    environment:
      # Drift fix (Apr 26 2026): prevent stale .pyc / AST cache after host file edits.
      PYTHONDONTWRITEBYTECODE: "1"
      # X.28: dev runs as host UID 1000 but prod's `scaffold-logs` named
      # volume is owned by scaffold UID 10001 (per chown_named_volumes.sh).
      # Empty LOG_FILE skips the RotatingFileHandler init in
      # app/logging_config.py — stdout still carries the structured log
      # stream, which `docker logs` captures, so dev visibility is intact.
      LOG_FILE: ""
      # §17.571: parallel-frontier execution is PROMOTED to default-ON in prod
      # (config.py default True). Pin it OFF in dev so the mock-based serial
      # executor suite (which validates the serial loop's session/keepalive/
      # retry internals) keeps exercising the serial path. The dedicated
      # parallel tests (test_*_parallel.py + the integration claim test)
      # enable it explicitly at runtime, so dev coverage of both paths is intact.
      PARALLEL_EXECUTION_ENABLED: "false"
      # §17.776: enable per-node token streaming in dev so node_token SSE frames
      # stream live during /execute/all. Default OFF in config.py (a fully
      # streamed node isn't cost-tracked); flipped ON here for the serial path
      # this host runs. Streaming only kicks in on the serial executor, which is
      # exactly what PARALLEL_EXECUTION_ENABLED=false above selects.
      NODE_TOKEN_STREAMING_ENABLED: "true"
    # Dev-only mounts. All :ro so the container view cannot mutate host
    # source. These shadow the image's baked-in copies with the working
    # tree so edits pick up live without a rebuild — the live-reload
    # affordance the prod compose used to (incorrectly) enable.
    volumes:
      # Source tree — live edit during development.
      - ./app:/code/app:ro
      - ./tests:/code/tests:ro
      - ./cli:/code/cli:ro
      - ./sdk:/code/sdk:ro
      - ./scripts:/code/scripts:ro
      - ./db:/code/db:ro
      # Pipeline + repo-shape inputs probed by tests.
      - ./pipelines:/code/pipelines:ro
      - ./Dockerfile:/code/Dockerfile:ro
      - ./.github:/code/.github:ro
      # X.28 polish: pyproject is read by pytest at every run; mounting :ro
      # so config edits land live without rebuilding the dev image.
      - ./pyproject.toml:/code/pyproject.toml:ro
      # Read mount so `make openapi-check` can compare the live spec against
      # the committed docs/openapi.json. The write path goes through stdout
      # in `make openapi-snapshot`, so no rw mount is needed.
      - ./docs:/code/docs:ro
      # X.21 — writable mount for bench_pipeline + bench_rag + bench_embed.
      # The script directory itself is read-only (under /code/tests:ro) so
      # results JSONL writes need a separate rw home. Mounting just the
      # benchmarks/ subdir keeps tests/ as a whole read-only so bench
      # scripts can't accidentally mutate test sources.
      - ./tests/benchmarks:/code/tests/benchmarks
      # §17.97 — requirements files for `make audit`. The runtime + dev
      # image stages don't preserve these (builder stage installs from
      # them, then they're discarded). Bind-mount :ro so pip-audit can
      # read them at scan time without forcing an image rebuild on every
      # `requirements.txt` edit.
      - ./requirements.txt:/code/requirements.txt:ro
      - ./requirements-dev.txt:/code/requirements-dev.txt:ro
      - ./requirements-ci.txt:/code/requirements-ci.txt:ro
