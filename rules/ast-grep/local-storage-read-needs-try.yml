# §17.1055 — localStorage can throw (private mode, blocked site data); every
# read the SPA depends on must be guarded. Advisory: the pre-existing reads in
# app.js/util.js are listed as warnings until they are wrapped.
id: local-storage-read-needs-try
language: javascript
severity: warning
message: localStorage access should sit inside a try block (it throws in private mode)
files:
  - app/ui/static/**/*.js
rule:
  pattern: localStorage.$METHOD($$$ARGS)
  not:
    inside:
      kind: try_statement
      stopBy: end
