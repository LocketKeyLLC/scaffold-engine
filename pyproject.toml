[project]
name = "scaffold-engine"
# §17.854 (audit H2) — kept in lockstep with app/main.py FastAPI version + the
# latest git tag. The check-version static gate (make check-version) fails if
# these drift.
version = "1.7.0"
description = "Self-hosted DAG orchestration engine for multi-step LLM workflows."
requires-python = ">=3.11"
# The server (this repository root) is source-available under the Business
# Source License 1.1 — see ./LICENSE. The client SDK (sdk/) and CLI (cli/)
# are separately licensed under Apache-2.0; see sdk/LICENSE and cli/LICENSE.
license = { text = "BUSL-1.1" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["internal", ".backups", ".venv-ci", "docs/toon"]

[tool.ruff.lint]
# Correctness-focused baseline: pyflakes (unused imports/vars, undefined
# names, bad f-strings), runtime syntax errors, and invalid escape
# sequences. Stylistic rules (import sorting, PEP 604 unions, blind-except)
# are intentionally deferred to keep this baseline green; enable them
# incrementally rather than in one churny sweep.
select = ["F", "E9", "W605", "B905"]
# §17.1059 — B905 (zip without strict=): a length mismatch must fail loudly
# where the sequences are built together. RUF100 (unused noqa) is NOT enabled:
# its autofix stripped the "— why" text on 351 documented suppressions.
# F401 (unused-import) is deferred, NOT auto-fixed: this codebase deliberately
# re-exports names through modules (e.g. `app.modules.research_agent` re-exports
# extractor/state helpers "for test patches and existing call sites"), and
# ruff's F401 removal strips those re-exports and breaks them. Enforce/enable
# only with per-module review, never a blanket --fix.
# F841 (assigned-but-unused locals) is deferred: a few live sites read like
# possible bug-hints (a value computed then dropped) rather than dead code.
ignore = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# §17.1057 — ast-grep known-hit fixtures are deliberately unresolved code
"tests/fixtures/**" = ["F821", "F401"]
# Test modules use `from module import *` fixtures heavily and freely
# import-for-availability; enforcing pyflakes there is churn without payoff.
"tests/**" = ["F403", "F405", "F401", "F811", "F841"]
# Package __init__ files re-export names for the public import surface.
"**/__init__.py" = ["F401"]
# scaffold_router imports two helpers, uses them during bootstrap, then
# `del`s them; ruff's flow analysis misreads the post-`del` refs as undefined.
"pipelines/scaffold_router.py" = ["F821"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# X.28: prod rootfs is read_only and /code is root-owned in the dev image
# (orchestrator runs as scaffold/10001, dev tests as 1000). Pin the cache
# under /tmp (tmpfs in prod, writable in dev) so pytest can persist
# nodeids/lastfailed without PytestCacheWarning at every shutdown.
cache_dir = "/tmp/.pytest_cache"
# default 30s timeout (individual tests can override via @pytest.mark.timeout) - fix #9.5
# asyncio_mode=auto removes the need for @pytest.mark.asyncio on every async test - fix #9.4
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--timeout=30",
]
asyncio_mode = "auto"
# Share one event loop across the session. Without this, each async test gets
# a fresh loop, but module-level async resources (app.database.engine,
# asyncpg pools) bind to the first loop and fail with "Event loop is closed"
# in subsequent tests' cleanup. The integration suite hits this directly;
# mock-based tests are unaffected.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "smoke: Fast sanity checks - unit tests, extraction pipeline (<2 min)",
    "validate: Integration tests - API, reranker, verifier (<15 min)",
    # §17.828 (plan 7.5) — everything under tests/integration/ (auto-applied by
    # its conftest) plus tests/test_integration.py. Cloud CI deselects with
    # `-m "not integration"`; before this marker test.yml used the fragile
    # `-k "not integration"` node-id substring match.
    "integration: Needs the live docker stack (Postgres at minimum, some Milvus/Ollama); deselected in cloud CI",
]
# Known noise: ~6-8 RuntimeWarnings per full-suite run with messages
# `coroutine 'AsyncMockMixin._execute_mock_call' was never awaited` and
# `coroutine 'Connection._cancel' was never awaited`. These fire from
# pytest's internal stash teardown (_pytest/stash.py:108) AFTER the
# warning-capture context exits, so neither `filterwarnings = [...]`
# in this table nor `-W` via addopts catches them. Tracemalloc traces
# show no user-code frames — they originate in asyncio/unittest.mock
# internals — and warning attribution shifts by test order, confirming
# they aren't per-test bugs. CLI-supplied `-W` does suppress them;
# leaving them visible here so a future investigator has a record.

# §17.553 — coverage config (coverage.py namespace; `--strict-config` only
# validates pytest keys, so these are safe). Consumed only when `--cov` is
# passed by `make coverage` — never in addopts, so cloud ci-smoke (which has
# no pytest-cov) is unaffected. Measures app/ unit coverage; integration
# tests are excluded from the standard run, so the number under-reports
# I/O-heavy modules (live execution/RAG/sim paths) — read it as unit cov.
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__main__.py"]
# X.28 (same reason as cache_dir above) — /code is root-owned in the dev
# image but tests run as uid 1000, so coverage can't write its default
# CWD-relative .coverage SQLite DB. Pin it under writable /tmp.
data_file = "/tmp/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# §17.1057 — mutation testing over the deterministic gate modules only (the
# §17.906 class: gates green but inert). `make mutate` runs it in the dev image.
[tool.mutmut]
source_paths = [
    "app/modules/assist_policy.py",
    "app/modules/assist_state_check.py",
]
# Source-inspection tests read the real files, which mutmut's `mutants/` copy
# rewrites (every function gets a `x_<name>__mutmut_N` twin); deselect them.
# `-o addopts=` drops the repo's --strict-config: mutmut disables the cache
# plugin, which makes the pinned cache_dir an "unknown option" under strict.
# `-o pythonpath=.`: pytest runs with cwd=mutants/, and this puts mutants/
# ahead of the repo root on sys.path so `import app` is the MUTATED copy
# (first run without it: 726 survived, 0 killed — the real app was imported).
pytest_add_cli_args = ["-o", "addopts=", "-o", "pythonpath=.", "-q", "--timeout=120", "-o", "cache_dir=/tmp/pc", "-p", "no:warnings",
    "--deselect", "tests/test_assist_state_check.py::test_the_state_check_is_wired_on_every_entry_and_applied_only_on_confirm",
    "--deselect", "tests/test_state_check_reopen_gate.py::test_judge_rule_and_verdict_shape_carry_the_title",
    "--deselect", "tests/test_remaining_engine_items_1056.py::test_decide_switches_thinking_off",
    "--deselect", "tests/test_remaining_engine_items_1056.py::test_restore_route_is_declared",
    "--deselect", "tests/test_remaining_engine_items_1056.py::test_blocked_submit_yields_offer_and_one_fix_with_the_nudge_inside"]
# mutmut copies only source_paths + also_copy into mutants/ and runs the tests
# from there; tests/conftest.py eager-loads the whole app, so the whole tree
# (and the sdk/pipelines/presets the suite probes) must ride along.
also_copy = ["app", "sdk", "pipelines", "presets", "docs", "db", "scripts", ".env.example"]
pytest_add_cli_args_test_selection = [
    "tests/test_assist_policy.py",
    "tests/test_assist_hedged_routing.py",
    "tests/test_assist_add_step_proposal.py",
    "tests/test_assist_state_check.py",
    "tests/test_state_check_reopen_gate.py",
    "tests/test_remaining_engine_items_1056.py",
]
