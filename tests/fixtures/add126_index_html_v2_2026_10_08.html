<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f0f2f5;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: #1a1a2e;
      color: white;
      padding: 1.5rem 2rem;
      text-align: center;
    }
    header h1 { font-size: 1.8rem; font-weight: 600; }
    header p { color: #aaa; margin-top: 0.3rem; }
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
    }
    .section {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .section:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .section h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #e0e0e0;
      color: #1a1a2e;
    }
    .section .status {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-left: 0.5rem;
    }
    .status.ok { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.loading { background: #fff3cd; color: #856404; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; }
    input[type="text"], select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }
    button {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    button:hover { background: #2d2d4e; }
    button:disabled { background: #999; cursor: not-allowed; }
    .result {
      margin-top: 1rem;
      padding: 0.8rem;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 0.85rem;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .result.error { background: #f8d7da; color: #721c24; }
    .result.success { background: #d4edda; color: #155724; }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .settings-grid label { font-size: 0.8rem; margin-bottom: 0.2rem; }
    .settings-grid input { font-size: 0.8rem; padding: 0.4rem; margin-bottom: 0.3rem; }
  </style>
</head>
<body>
  <header>
    <h1>Control Panel</h1>
    <p>Manage your services from one place</p>
  </header>
  <main>
    <!-- Palworld Settings Section -->
    <div class="section" id="palworld-settings-section">
      <h2>Palworld Settings <span class="status loading" id="palworld-status">Loading...</span></h2>
      <div id="palworld-content">
        <p>Loading settings...</p>
      </div>
    </div>

    <!-- Media Request Section -->
    <div class="section" id="media-request-section">
      <h2>Media Request <span class="status loading" id="media-status">Ready</span></h2>
      <form id="media-form">
        <label for="media-title">Title</label>
        <input type="text" id="media-title" placeholder="Enter movie or TV show title" required>
        <label for="media-type">Type</label>
        <select id="media-type">
          <option value="movie">Movie</option>
          <option value="tv">TV Show</option>
        </select>
        <button type="submit">Request Media</button>
      </form>
      <div class="result" id="media-result" style="display:none;"></div>
    </div>

    <!-- Scaffold Engine Section -->
    <div class="section" id="scaffold-engine-section">
      <h2>Scaffold Engine <span class="status loading" id="scaffold-status">Loading...</span></h2>
      <div id="scaffold-content">
        <p>Checking engine health...</p>
      </div>
    </div>

    <!-- Network View Section -->
    <div class="section" id="network-view-section">
      <h2>Network View <span class="status loading" id="network-status">Loading...</span></h2>
      <div id="network-content">
        <p>Loading Pi-hole statistics...</p>
      </div>
    </div>
  </main>

  <script>
    // Load Palworld settings
    async function loadPalworldSettings() {
      const statusEl = document.getElementById('palworld-status');
      const contentEl = document.getElementById('palworld-content');
      try {
        const res = await fetch('/api/palworld-settings');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const settings = await res.json();
        statusEl.textContent = 'OK';
        statusEl.className = 'status ok';
        
        let html = '<div class="settings-grid">';
        const keys = Object.keys(settings);
        if (keys.length === 0) {
          html = '<p>No settings found.</p>';
        } else {
          for (const key of keys) {
            const escapedValue = String(settings[key]).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html += `<label>${key}</label><input type="text" value="${escapedValue}" data-key="${key}">`;
          }
          html += '</div>';
          html += '<button onclick="savePalworldSettings()">Save Settings</button>';
        }
        contentEl.innerHTML = html;
      } catch (err) {
        statusEl.textContent = 'Error';
        statusEl.className = 'status error';
        contentEl.innerHTML = `<p class="result error">Failed to load settings: ${err.message}</p>`;
      }
    }

    async function savePalworldSettings() {
      const inputs = document.querySelectorAll('#palworld-content input[data-key]');
      const settings = {};
      inputs.forEach(input => {
        settings[input.dataset.key] = input.value;
      });
      try {
        const res = await fetch('/api/palworld-settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        alert('Settings saved successfully!');
        loadPalworldSettings();
      } catch (err) {
        alert('Failed to save settings: ' + err.message);
      }
    }

    // Media request form
    document.getElementById('media-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('media-title').value;
      const type = document.getElementById('media-type').value;
      const resultEl = document.getElementById('media-result');
      const statusEl = document.getElementById('media-status');
      
      statusEl.textContent = 'Submitting...';
      statusEl.className = 'status loading';
      resultEl.style.display = 'block';
      resultEl.textContent = 'Submitting request...';
      resultEl.className = 'result';
      
      try {
        const res = await fetch('/api/media-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, type })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
        
        statusEl.textContent = 'OK';
        statusEl.className = 'status ok';
        resultEl.textContent = JSON.stringify(data, null, 2);
        resultEl.className = 'result success';
        document.getElementById('media-title').value = '';
      } catch (err) {
        statusEl.textContent = 'Error';
        statusEl.className = 'status error';
        resultEl.textContent = 'Error: ' + err.message;
        resultEl.className = 'result error';
      }
    });

    // Load scaffold engine health
    async function loadScaffoldEngine() {
      const statusEl = document.getElementById('scaffold-status');
      const contentEl = document.getElementById('scaffold-content');
      try {
        const res = await fetch('/api/scaffold-engine');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        statusEl.textContent = 'OK';
        statusEl.className = 'status ok';
        contentEl.innerHTML = `<div class="result success">${JSON.stringify(data, null, 2)}</div>`;
      } catch (err) {
        statusEl.textContent = 'Error';
        statusEl.className = 'status error';
        contentEl.innerHTML = `<p class="result error">Failed to reach scaffold engine: ${err.message}</p>`;
      }
    }

    // Load network view
    async function loadNetworkView() {
      const statusEl = document.getElementById('network-status');
      const contentEl = document.getElementById('network-content');
      try {
        const res = await fetch('/api/network-view');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        statusEl.textContent = 'OK';
        statusEl.className = 'status ok';
        contentEl.innerHTML = `<div class="result success">${JSON.stringify(data, null, 2)}</div>`;
      } catch (err) {
        statusEl.textContent = 'Error';
        statusEl.className = 'status error';
        contentEl.innerHTML = `<p class="result error">Failed to load Pi-hole stats: ${err.message}</p>`;
      }
    }

    // Load all sections on page load
    loadPalworldSettings();
    loadScaffoldEngine();
    loadNetworkView();
  </script>
</body>
</html>
