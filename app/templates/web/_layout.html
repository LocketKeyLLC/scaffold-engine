<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {# §17.460 — disable htmx's auto-injected indicator <style> (we don't use
     .htmx-indicator); otherwise it would be an un-nonced inline <style> blocked
     by the strict CSP (style-src has no 'unsafe-inline'). #}
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
  <title>{% block title %}Scaffold Engine{% endblock %}</title>
  <link rel="stylesheet" href="/static/web.css">
  {# §17.459 — vendored locally (was unpkg.com). Drops the runtime CDN dep so the
     UI works airgapped + matches the project's pin-everything posture. To update:
     re-download the pinned versions into app/static/vendor/ and refresh
     app/static/vendor/VENDOR.md (versions + sha256). #}
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="/static/vendor/htmx-ext-sse-2.2.2.js" defer></script>
</head>
<body>
  {# §17.461 — a11y: skip link (first focusable element) jumps keyboard users
     past the nav straight to content. #}
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="top-nav">
    <a href="/web/jobs" class="brand">Scaffold Engine</a>
    <nav aria-label="Primary">
      <a href="/web/jobs">Jobs</a>
      <a href="/web/new" class="nav-cta">+ New idea</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
