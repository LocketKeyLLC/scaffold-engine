<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Scaffold Engine mark — a hexagonal construction lattice (nodes + struts,
       violet → teal), echoing the DAG the engine builds. Referenced as an
       <img> by the SPA chrome and as the favicon. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <g stroke="url(#g)" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M32 7 L53 19.5 L53 44.5 L32 57 L11 44.5 L11 19.5 Z"/>
    <path d="M32 7 L32 32 M53 19.5 L32 32 M53 44.5 L32 32 M32 57 L32 32 M11 44.5 L32 32 M11 19.5 L32 32"/>
  </g>
  <circle cx="32" cy="7" r="4.4" fill="#8b5cf6"/>
  <circle cx="53" cy="19.5" r="4.4" fill="#7c5cf5"/>
  <circle cx="11" cy="19.5" r="4.4" fill="#a78bfa"/>
  <circle cx="53" cy="44.5" r="4.4" fill="#2dd4bf"/>
  <circle cx="11" cy="44.5" r="4.4" fill="#34d0cf"/>
  <circle cx="32" cy="57" r="4.4" fill="#2dd4bf"/>
  <circle cx="32" cy="32" r="5.6" fill="url(#g)"/>
</svg>
