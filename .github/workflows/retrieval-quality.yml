name: Retrieval Quality (non-blocking)

on:
  pull_request:
    paths:
      - 'app/modules/rag_pipeline.py'
      - 'app/rerankers.py'
      - 'app/utils/retrieval_metrics.py'
      - 'scripts/score_retrieval.py'
      - 'tests/fixtures/golden_set.json'
      - 'tests/test_score_retrieval.py'
      - 'tests/test_retrieval_metrics.py'
      - 'tests/test_rag_pipeline_smoke.py'
      # §17.798 — citation-faithfulness parser (pure, no services)
      - 'app/modules/citation_faithfulness.py'
      - 'tests/test_citation_faithfulness_17798.py'
      # §17.432 — self-trigger so edits to this workflow re-run it (its own
      # fix can't be proven otherwise; the paths above don't include it).
      - '.github/workflows/retrieval-quality.yml'

jobs:
  score:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # §17.534 — pin the patch version to match the 3.12.13 used by every
          # other workflow + the Dockerfile base, so a floating 3.12.x bump can't
          # silently change behavior under this gate.
          python-version: '3.12.13'

      # §17.432 — install requirements-ci.txt, not a bare `pytest pytest-asyncio`.
      # Both target tests import the app (conftest.py eager-imports
      # app.model_router → httpx) and rag_pipeline (→ pymilvus), so the old
      # minimal install failed at collection with ModuleNotFoundError: httpx.
      # requirements-ci.txt pins httpx + pymilvus + pytest + pytest-asyncio +
      # pytest-timeout — the same proven set ci.yml's smoke job uses — and is
      # still "cheap" (no torch, no live services).
      - name: Install test deps
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      # Sprint X.14 — runs layers cheaply (no Milvus / Ollama / cross-encoder):
      #   - test_retrieval_metrics.py: RAGAS + ranking metric math
      #     (hit@k, MRR, nDCG@k, context precision/recall — §17.430/§17.794)
      #   - test_score_retrieval.py: scoring harness math (title-substring shape)
      #   - test_rag_pipeline_smoke.py: 3-query orchestration smoke
      #     (RRF fusion, dedup, threshold-skip path)
      # NOTE: the metric MATH is the authoritative blocking gate — it also runs
      # in the `-m smoke` ci-smoke job (ci.yml). This workflow is the (non-
      # blocking) retrieval report; the live RAGAS floors + faithfulness run in
      # tests/integration/test_retrieval_eval.py locally (need Milvus + Ollama).
      - name: Run scoring + smoke tests
        env:
          SCAFFOLD_API_KEY: "test-key-for-ci"
          PYTHONPATH: "."
        run: pytest tests/test_retrieval_metrics.py tests/test_score_retrieval.py tests/test_rag_pipeline_smoke.py tests/test_citation_faithfulness_17798.py -v

      - name: Upload report if present
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-report
          path: retrieval_report.json
          if-no-files-found: ignore
