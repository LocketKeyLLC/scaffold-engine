name: Build CI image

# §17.588 (#102) — Build the heavy orchestrator image (torch +
# sentence-transformers + the baked 0.6B reranker) ONCE on main and push it to
# ghcr as scaffold-orchestrator-ci:latest. The PR Unit Tests job (test.yml)
# then PULLS this instead of building it per-PR — turning the ~50-min 2-core
# build that timed out (§17.587 / #99) into a fast pull. Rebuilds only when the
# dep/build inputs change (requirements*/Dockerfile); code-only changes don't
# need a rebuild because the PR job mounts its own checkout over the image.
# Runs off the PR critical path, so a slow build here never gates a PR.
on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'requirements-ci.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - '.github/workflows/build-ci-image.yml'
  workflow_dispatch:

concurrency:
  group: build-ci-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build + push CI image to ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 60   # heavy build on a 2-core runner; not gating any PR
    steps:
      - uses: actions/checkout@v7

      # Same reclaim as §17.587 — the full torch+reranker build needs the disk.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ghcr paths must be lowercase; the owner ("LocketKeyLLC") isn't.
      - name: Compute image ref
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/scaffold-orchestrator-ci" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest = current main deps; :sha for pinning/debug.
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
