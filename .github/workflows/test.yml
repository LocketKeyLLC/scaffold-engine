name: Scaffold Engine CI

on:
  # §17.404 — skip docs-only pushes/PRs (paths-ignore fires only when ALL
  # changed files match), so a pure OVERVIEW.md edit doesn't trigger the
  # ~14-min metered full-suite build. Mixed code+docs commits still run.
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

# §17.399 — cancel superseded runs. This job is a ~20-min full-suite build
# on a metered 2-core private-repo runner; without this, rapid pushes to the
# same ref stack multiple in-flight runs (observed: 9 stacked timed-out runs
# in one session). Keyed by workflow+ref so different branches/PRs don't
# cancel each other; a new push to the same ref cancels the prior in-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: scaffold
  POSTGRES_PASSWORD: scaffold_ci_pw
  POSTGRES_DB: scaffold_engine
  DATABASE_URL: postgresql+asyncpg://scaffold:scaffold_ci_pw@localhost:5432/scaffold_engine
  OLLAMA_BASE_URL: http://localhost:11434
  MILVUS_URI: http://localhost:19530
  SEARXNG_URL: http://localhost:8080
  SCAFFOLD_API_KEY: ci-test-key
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONPATH: /code
  # §17.555 — app/ coverage floor for the unit-test job. 77 = ~4-5 pts under
  # the measured baselines (81% in this exact `-k "not integration"` scope,
  # 82% for `-m "not validate"`); headroom for churn, fails on a real drop.
  COVERAGE_MIN: "77"

jobs:
  unit-tests:
    name: Unit Tests (no live services)
    runs-on: ubuntu-latest
    # §17.399 — raised 15→35. The §17.276 cap of 15 assumed a "well under
    # 5 min" suite, but it has since grown to ~3230 non-integration tests
    # that build the image (~3 min) + run on a 2-core private runner — the
    # job was hitting "exceeded 15m0s" and getting cancelled on EVERY run
    # (verified: tests ran 705s and were still going when cut). 35 min gives
    # the full suite room while still failing loud if Postgres/probe hangs.
    # §17.587 (#99) — raised 35→50: the 35 assumed a warm-cache ~3-min build,
    # but a COLD build (torch + model snapshot_download + deps, ~20 min) plus
    # the full suite overran 35 and got cancelled mid-build — which also meant
    # cache-to never exported, so the cache stayed cold (vicious cycle). 50 lets
    # one cold build finish + warm the gha cache; warm runs are back to ~20 min.
    timeout-minutes: 50

    services:
      postgres:
        # §17.534 — pin to the same digest the compose stack runs
        # (docker-compose.yml scaffold-postgres) so CI exercises the exact
        # Postgres build prod uses, not a floating postgres:16 tag.
        image: postgres:16@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
        env:
          POSTGRES_DB: scaffold_engine
          POSTGRES_USER: scaffold
          POSTGRES_PASSWORD: scaffold_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scaffold -d scaffold_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Apply DB schema
        run: PGPASSWORD=scaffold_ci_pw psql -h localhost -U scaffold -d scaffold_engine -f db/init.sql

      # §17.426 — reclaim runner disk before the buildx build. `cache-to:
      # type=gha,mode=max` (needed to cache the builder's reranker-download
      # layer) + `load: true` (needed so the next step's `docker run` finds the
      # image) write the ~3-4 GB image to disk several times over, which
      # overflows the ubuntu-latest ~14 GB free disk (the prior plain
      # `docker build` kept a single copy and fit). ubuntu-latest preinstalls
      # ~25 GB of toolchains this docker-build job never uses; dropping them
      # gives ample headroom. Real failure observed on the first §17.426 run:
      # `no space left on device` during "importing to docker".
      # §17.587 (#99) — the manual rm freed to ~40 GB, but the buildx build
      # (torch + sentence-transformers + the baked Qwen3-Reranker model, with
      # cache-to mode=max staging every layer + gha cache round-trip) still
      # overflowed while writing the reranker blob. Use the maintained
      # free-disk-space action for a thorough, safe reclaim (~30 GB more: large
      # apt packages, tool cache, swap, docker). SHA-pinned (post-§17.584
      # supply-chain caution). mode=max caching stays as-is — that's what kills
      # the HF-429 cold-pull flake (don't trade it away to save disk).
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          # §17.587 — ALL reclaimers on. Measured both ways: large-packages
          # off (fast) freed too little → OOM at the reranker blob again;
          # large-packages on freed enough (the build got past OOM). It's ~4 min
          # slower, which is why the timeout was raised 35→50 (below) — need the
          # disk AND the time, not one or the other.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # buildx + GitHub Actions layer cache. The reranker snapshot_download is
      # the last builder layer; on a warm cache (Dockerfile + requirements
      # unchanged) the whole builder stage is a layer-cache HIT, so
      # snapshot_download never runs and never round-trips to the HF Hub —
      # killing the recurring 429 build flake (issue #3; the bare `docker build`
      # did a cold HF pull on every run). The §17.423 in-Dockerfile retry stays
      # as the fallback for the rarer cache-miss case (a requirements change
      # invalidates the download layer). `load: true` puts the built image into
      # the docker daemon so the next step's `docker run` finds it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scaffold-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # §17.534 — image vulnerability scan of the freshly-built orchestrator
      # image. REPORT-ONLY (exit-code 0): OS/base-layer CVEs are frequently
      # unfixed-upstream and shouldn't block a merge, but surfacing HIGH/CRITICAL
      # here gives a standing signal for when to bump the digest-pinned base.
      # The BLOCKING dependency gate is pip-audit in ci.yml (deps we control).
      # ignore-unfixed keeps the report to actionable findings.
      - name: Trivy image scan (report-only)
        # §17.587 (#99) — report-only means the SCAN result never gates, but the
        # ACTION can still fail the job on infra (trivy DB pull from ghcr flakes/
        # rate-limits), which aborted the run *before* the unit tests. Make it
        # truly non-blocking so a trivy DB hiccup can't fail Unit Tests.
        continue-on-error: true
        # §17.584 — SHA-pinned to v0.36.0. aquasecurity/trivy-action was
        # supply-chain-compromised in Mar 2026 (76/77 tags force-pushed to
        # malware, CVE-2026-33634); the old `@0.28.0` tag no longer resolves.
        # Pin to the immutable commit SHA rather than a re-pushable tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: scaffold-orchestrator:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # §17.555 — runs the unit suite AND gates app/ coverage at COVERAGE_MIN%.
      # pytest-cov rides in via the dev build stage (requirements-dev.txt).
      # COVERAGE_FILE under /tmp: the ci image's /code is root-owned but the
      # container's default user differs, so coverage's CWD-relative SQLite DB
      # is unwritable (same fix as `make coverage`). --cov-fail-under exits
      # non-zero on a coverage drop, failing the job.
      - name: Run unit tests + coverage gate
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=$DATABASE_URL \
            -e OLLAMA_BASE_URL=$OLLAMA_BASE_URL \
            -e MILVUS_URI=$MILVUS_URI \
            -e SEARXNG_URL=$SEARXNG_URL \
            -e SCAFFOLD_API_KEY=$SCAFFOLD_API_KEY \
            -e PYTHONPATH=/code:/code/sdk \
            -e COVERAGE_FILE=/tmp/.coverage \
            scaffold-orchestrator:ci \
            pytest tests/ --timeout=30 -v \
              -k "not integration" \
              --cov=app --cov-branch \
              --cov-report=term-missing:skip-covered \
              --cov-fail-under=${COVERAGE_MIN}

  # Full integration tests require Ollama + Milvus + SearXNG.
  # Enable this job on a self-hosted runner with GPU/CPU inference.
  # integration-tests:
  #   name: Integration Tests (full stack)
  #   runs-on: self-hosted
  #   steps:
