name: Scaffold Engine CI

on:
  # §17.588 (#102) — PR/push gating RESTORED. This job no longer BUILDS the
  # heavy image per-PR (§17.587/#99 took it off the critical path because the
  # ~50-min 2-core build timed out). It now PULLS the prebuilt
  # scaffold-orchestrator-ci image (built on main by build-ci-image.yml) and
  # runs the PR's checked-out code mounted over it — a fast pull, not a build.
  # Dep-change PRs (requirements*/Dockerfile) fall back to a local build so
  # they never test against stale deps. §17.404 — skip docs-only changes.
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

# §17.399 — cancel superseded runs. This job is a ~20-min full-suite build
# on a metered 2-core private-repo runner; without this, rapid pushes to the
# same ref stack multiple in-flight runs (observed: 9 stacked timed-out runs
# in one session). Keyed by workflow+ref so different branches/PRs don't
# cancel each other; a new push to the same ref cancels the prior in-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: scaffold
  POSTGRES_PASSWORD: scaffold_ci_pw
  POSTGRES_DB: scaffold_engine
  DATABASE_URL: postgresql+asyncpg://scaffold:scaffold_ci_pw@localhost:5432/scaffold_engine
  OLLAMA_BASE_URL: http://localhost:11434
  MILVUS_URI: http://localhost:19530
  SEARXNG_URL: http://localhost:8080
  SCAFFOLD_API_KEY: ci-test-key
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONPATH: /code
  # §17.555 — app/ coverage floor for the unit-test job. 77 = ~4-5 pts under
  # the measured baselines (81% in this exact `-k "not integration"` scope,
  # 82% for `-m "not validate"`); headroom for churn, fails on a real drop.
  COVERAGE_MIN: "77"

jobs:
  unit-tests:
    name: Unit Tests (no live services)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # §17.588 — pull the prebuilt CI image from ghcr
    # §17.588 (#102) — the common path now PULLS the prebuilt image (fast, ~15
    # min incl. the full suite), no build. The 50-min budget is the ceiling for
    # the RARE dep-change fallback that still builds locally (torch+model,
    # ~45 min on the 2-core runner). Pull-path PRs finish well under it.
    # History: §17.399 raised 15→35, §17.587 raised 35→50 when this job still
    # built per-PR (before the prebuilt-pull redesign).
    timeout-minutes: 50

    services:
      postgres:
        # §17.534 — pin to the same digest the compose stack runs
        # (docker-compose.yml scaffold-postgres) so CI exercises the exact
        # Postgres build prod uses, not a floating postgres:16 tag.
        image: postgres:16@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
        env:
          POSTGRES_DB: scaffold_engine
          POSTGRES_USER: scaffold
          POSTGRES_PASSWORD: scaffold_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scaffold -d scaffold_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # §17.588 — fetch-depth: 0 so the dep-change diff below can compare
      # against the PR base / previous push SHA.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply DB schema
        run: PGPASSWORD=scaffold_ci_pw psql -h localhost -U scaffold -d scaffold_engine -f db/init.sql

      # §17.588 (#102) — lowercase ghcr ref for the prebuilt image.
      - name: Compute CI image ref
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/scaffold-orchestrator-ci" >> "$GITHUB_OUTPUT"

      # If this PR/push changes the dep/build inputs, the prebuilt image (built
      # from main's deps) is stale → build locally for this run so we never test
      # against wrong deps. Otherwise (the common case) pull the prebuilt image.
      - name: Decide pull vs build
        id: deps
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          [ -z "$base" ] && base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"   # dispatch / first push → build to be safe
          elif git diff --name-only "$base" HEAD -- requirements.txt requirements-ci.txt requirements-dev.txt Dockerfile | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Fast path: pull the prebuilt image (deps unchanged) ---
      - name: Pull prebuilt CI image
        if: steps.deps.outputs.build == 'false'
        run: |
          if docker pull "${{ steps.img.outputs.ref }}:latest"; then
            docker tag "${{ steps.img.outputs.ref }}:latest" scaffold-orchestrator:ci
          else
            echo "::warning::prebuilt image not found — falling back to local build"
            echo "BUILD_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      # --- Slow path (rare): deps changed in this PR, or no prebuilt image ---
      # §17.587 reclaim — only needed when we actually build here.
      - name: Free up runner disk space
        if: steps.deps.outputs.build == 'true' || env.BUILD_FALLBACK == '1'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        if: steps.deps.outputs.build == 'true' || env.BUILD_FALLBACK == '1'
        uses: docker/setup-buildx-action@v4

      - name: Build orchestrator image (deps changed / no prebuilt)
        if: steps.deps.outputs.build == 'true' || env.BUILD_FALLBACK == '1'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: scaffold-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # §17.534 — report-only image scan. §17.587 — continue-on-error so a
      # trivy DB-pull flake can't fail the job. §17.584 — SHA-pinned v0.36.0
      # (action was supply-chain-compromised Mar 2026; pin to the commit).
      # §17.830 (audit "Trivy is double non-blocking", plan 7.7) — still
      # report-only, but the report now lands in the job summary + a warning
      # annotation instead of being buried mid-log where nobody ever saw it.
      - name: Trivy image scan (report-only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: scaffold-orchestrator:ci
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # §17.830 (plan 7.7) — publish the scan where it's actually seen: the
      # run's job summary (renders on the PR checks page) plus a ::warning
      # annotation when there are findings. Blocking on HIGH+fixable is a
      # deliberate later step (plan note) — this makes report-only honest.
      - name: Publish Trivy report to job summary (§17.830)
        if: always()
        run: |
          {
            echo "### Trivy image scan — HIGH/CRITICAL, fixable only (report-only)"
            if [ -s trivy-report.txt ]; then
              echo '```'
              cat trivy-report.txt
              echo '```'
            else
              echo "_No report produced (scan flaked or image missing) — see the Trivy step log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A table with any vulnerability rows mentions the severity keywords;
          # an empty/clean scan doesn't. Rough but errs toward warning.
          if [ -s trivy-report.txt ] && grep -qE 'HIGH|CRITICAL' trivy-report.txt; then
            echo "::warning title=Trivy image scan::HIGH/CRITICAL findings in scaffold-orchestrator:ci — see the job summary for the table."
          fi

      # §17.812 (audit C7) — db/init.sql is only the post-033 BASELINE; migrations
      # 034+ apply at app lifespan (which pytest never triggers), so CI was testing
      # against a schema with no api_keys / runtime_profile / jobs.owner — every
      # multi-user RBAC path took a caught-exception branch and an authz regression
      # could pass the gate. Apply them here inside the CI image (needs the app's
      # asyncpg deps + the runner's own file-resolution: _MIGRATIONS_DIR is the
      # baked /code/db/migrations, overlaid by the PR's db/ mount). This mirrors
      # the production startup path exactly.
      - name: Apply migrations 034+ (init.sql is the 033 baseline)
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PYTHONPATH=/code:/code/sdk \
            -v "$PWD/app:/code/app:ro" \
            -v "$PWD/db:/code/db:ro" \
            scaffold-orchestrator:ci \
            python -m app.migrations

      # §17.812 — fail LOUDLY if the load-bearing RBAC/runtime schema is absent,
      # so a broken migration can't slip through on exception-handler coverage.
      - name: Assert RBAC/runtime schema is present
        run: |
          PGPASSWORD=scaffold_ci_pw psql -h localhost -U scaffold -d scaffold_engine \
            -v ON_ERROR_STOP=1 -c \
            "SELECT 'api_keys'::regclass, 'runtime_profile'::regclass, 'model_overrides'::regclass;" \
            -c "SELECT owner FROM jobs LIMIT 0;" \
            -c "SELECT quick_mode FROM jobs LIMIT 0;"

      # §17.555 — full unit suite + app/ coverage gate at COVERAGE_MIN%.
      # §17.588 — mount THIS PR's source over the (pulled) image so tests run
      # against the PR's code + the image's deps. Mirrors docker-compose.dev.yml's
      # bind-mount set; /code/.cache (baked reranker) and /opt/venv (deps) are
      # NOT mounted over, so they come from the image. COVERAGE_FILE under /tmp
      # (image /code is root-owned; container user differs — same as make coverage).
      # §17.589 — pipelines/ is mounted READ-WRITE (not :ro): the pipeline valve
      # bootstrap writes valves.json into pipelines/<name>/, and a fresh CI
      # checkout has none (valves.json is gitignored runtime state), so it must
      # be creatable. (Locally it passes because the dev host already has them.)
      - name: Run unit tests + coverage gate
        run: |
          # §17.589 — the container runs as uid 1000 (scaffold) but the mounted
          # pipelines/ dir is owned by the runner uid; make it group/other
          # writable so the valve bootstrap can create valves.json.
          chmod -R a+w pipelines || true
          # §17.589 — --ignore ONLY the modules that need live services this
          # no-services job lacks (Redis/Milvus/Ollama for execute_all_nodes);
          # they pass locally + in the nightly full stack. Everything else runs
          # on just Postgres, keeping coverage ~80% (the broad
          # SCAFFOLD_CI_SMOKE_MODE excluded ~52 modules → 70%, under the gate).
          docker run --rm \
            --network host \
            -e DATABASE_URL=$DATABASE_URL \
            -e OLLAMA_BASE_URL=$OLLAMA_BASE_URL \
            -e MILVUS_URI=$MILVUS_URI \
            -e SEARXNG_URL=$SEARXNG_URL \
            -e SCAFFOLD_API_KEY=$SCAFFOLD_API_KEY \
            -e PYTHONPATH=/code:/code/sdk \
            -e COVERAGE_FILE=/tmp/.coverage \
            -v "$PWD/app:/code/app:ro" \
            -v "$PWD/tests:/code/tests:ro" \
            -v "$PWD/cli:/code/cli:ro" \
            -v "$PWD/sdk:/code/sdk:ro" \
            -v "$PWD/scripts:/code/scripts:ro" \
            -v "$PWD/db:/code/db:ro" \
            -v "$PWD/pipelines:/code/pipelines" \
            -v "$PWD/docs:/code/docs:ro" \
            -v "$PWD/pyproject.toml:/code/pyproject.toml:ro" \
            scaffold-orchestrator:ci \
            pytest tests/ --timeout=30 -v \
              -k "not integration" \
              --ignore-glob='*/test_scaffold_router_*' \
              --ignore=tests/test_execution_agent_sse.py \
              --ignore=tests/test_execution_agent_concurrency.py \
              --ignore=tests/test_sse_streaming.py \
              --cov=app --cov-branch \
              --cov-report=term-missing:skip-covered \
              --cov-fail-under=${COVERAGE_MIN}

      # §17.826 (audit M11, plan 7.1) — the OWUI pipelines lane, run the way the
      # Makefile declares CORRECT: --noconftest. tests/conftest.py eager-loads
      # app/, which shadows the pipeline mocks (`_scaffold_router_setup.py`
      # stubs Pipeline._probe_embedder_dim etc.); before this step the 43
      # test_scaffold_router_* modules ran inside the main pytest run WITH
      # conftest — a configuration whose results the Makefile explicitly
      # distrusts (`make test` ignore-globs them; `make test-pipelines` is the
      # real lane). The main run above now ignore-globs them to match, and this
      # step runs them the correct way. No live services needed (verified
      # off-network: 1178 passed). pipelines/ stays the rw mount from the
      # chmod above (valve bootstrap writes valves.json on a fresh checkout).
      - name: Pipelines lane (test_scaffold_router_*, --noconftest)
        run: |
          docker run --rm \
            -e SCAFFOLD_API_KEY=$SCAFFOLD_API_KEY \
            -e PYTHONPATH=/code:/code/sdk \
            -v "$PWD/app:/code/app:ro" \
            -v "$PWD/tests:/code/tests:ro" \
            -v "$PWD/sdk:/code/sdk:ro" \
            -v "$PWD/pipelines:/code/pipelines" \
            -v "$PWD/pyproject.toml:/code/pyproject.toml:ro" \
            -w /code \
            scaffold-orchestrator:ci \
            sh -c 'pytest tests/test_scaffold_router_*.py --noconftest --timeout=30 -q'

      # §17.826 (audit M11, plan 7.2) — the CLI + SDK suites ran in NO workflow
      # (only via `make test-cli` / `make test-sdk` on the operator's box).
      # Same commands the Makefile runs, in the same image. Both are pure-mock
      # httpx suites (verified off-network: 167 + 146 passed).
      - name: CLI suite (cli/tests)
        run: |
          docker run --rm \
            -v "$PWD/cli:/code/cli:ro" \
            -w /code/cli \
            scaffold-orchestrator:ci \
            python -m pytest tests/ --timeout=10 -q

      - name: SDK suite (sdk/tests)
        run: |
          docker run --rm \
            -v "$PWD/sdk:/code/sdk:ro" \
            -w /code/sdk \
            scaffold-orchestrator:ci \
            python -m pytest tests/ --timeout=10 -q

  # Full integration tests require Ollama + Milvus + SearXNG.
  # Enable this job on a self-hosted runner with GPU/CPU inference.
