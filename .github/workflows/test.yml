name: Scaffold Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# §17.399 — cancel superseded runs. This job is a ~20-min full-suite build
# on a metered 2-core private-repo runner; without this, rapid pushes to the
# same ref stack multiple in-flight runs (observed: 9 stacked timed-out runs
# in one session). Keyed by workflow+ref so different branches/PRs don't
# cancel each other; a new push to the same ref cancels the prior in-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: scaffold
  POSTGRES_PASSWORD: scaffold_ci_pw
  POSTGRES_DB: scaffold_engine
  DATABASE_URL: postgresql+asyncpg://scaffold:scaffold_ci_pw@localhost:5432/scaffold_engine
  OLLAMA_BASE_URL: http://localhost:11434
  MILVUS_URI: http://localhost:19530
  SEARXNG_URL: http://localhost:8080
  SCAFFOLD_API_KEY: ci-test-key
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONPATH: /code

jobs:
  unit-tests:
    name: Unit Tests (no live services)
    runs-on: ubuntu-latest
    # §17.399 — raised 15→35. The §17.276 cap of 15 assumed a "well under
    # 5 min" suite, but it has since grown to ~3230 non-integration tests
    # that build the image (~3 min) + run on a 2-core private runner — the
    # job was hitting "exceeded 15m0s" and getting cancelled on EVERY run
    # (verified: tests ran 705s and were still going when cut). 35 min gives
    # the full suite room while still failing loud if Postgres/probe hangs.
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scaffold_engine
          POSTGRES_USER: scaffold
          POSTGRES_PASSWORD: scaffold_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scaffold -d scaffold_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Apply DB schema
        run: PGPASSWORD=scaffold_ci_pw psql -h localhost -U scaffold -d scaffold_engine -f db/init.sql

      - name: Build orchestrator image
        run: docker build -t scaffold-orchestrator:ci .

      - name: Run unit tests
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=$DATABASE_URL \
            -e OLLAMA_BASE_URL=$OLLAMA_BASE_URL \
            -e MILVUS_URI=$MILVUS_URI \
            -e SEARXNG_URL=$SEARXNG_URL \
            -e SCAFFOLD_API_KEY=$SCAFFOLD_API_KEY \
            -e PYTHONPATH=/code:/code/sdk \
            scaffold-orchestrator:ci \
            pytest tests/ --timeout=30 -v \
              -k "not integration"

  # Full integration tests require Ollama + Milvus + SearXNG.
  # Enable this job on a self-hosted runner with GPU/CPU inference.
