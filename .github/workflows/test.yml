  #       run: make test
  #     - name: Run retrieval eval (§17.358 — replaced make eval with score_retrieval.py)
  #       run: python3 scripts/score_retrieval.py --golden tests/fixtures/golden_set.json
  #     - name: Teardown
  #       if: always()
  #       run: docker compose down -v
