# Scaffold Engine CI
# ──────────────────────────────────────────────────────────
# Tier 1 (ci-smoke)  → every PR + main   → GitHub cloud runners  → no live services
# Tier 2 (validate)  → main merges only  → self-hosted / local   → full Docker stack
# Tier 1 budget: 10 min wall (~681 smoke tests post-§17.102; ~8 min local).
# ──────────────────────────────────────────────────────────
# See docs/CI.md for the full tier breakdown and local testing with `act`.

name: CI

on:
  # §17.404 — skip docs-only pushes/PRs. paths-ignore fires only when EVERY
  # changed file matches, so a mixed code+docs commit still runs the gates;
  # a pure OVERVIEW.md/README edit doesn't burn a metered run.
  #
  # §17.902 — this block used to read `push: branches: ["*"]` +
  # `pull_request: branches: [main]`, and BOTH halves were wrong:
  #
  #   * `"*"` does not match `/`. Every branch in this repo is `fix/…`,
  #     `feat/…` or `refactor/…`, so the push trigger silently matched only
  #     `main` — the "every push" the header promised had never once fired on
  #     a feature branch.
  #   * `pull_request: branches: [main]` filters on the PR's BASE, so a
  #     stacked PR (one opened against another feature branch) got no checks
  #     at all. Live: #343 sat with "no checks reported" until it was
  #     retargeted to main.
  #
  # Now: PRs are gated regardless of base (which is what actually protects
  # merges, stacked or not), and push covers the trunk after a merge. That is
  # one run per change — no push/PR double-billing on a metered private repo —
  # and matches test.yml's trigger shape.
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# §17.902 — cancel superseded runs. test.yml learned this at §17.399 after
# nine stacked timed-out runs piled up in one session; ci.yml never got it, so
# rapid pushes to the same ref still stack. Keyed by workflow+ref so different
# branches/PRs don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # §17.854 (audit H3) — match the runtime image (Dockerfile `python:3.14.7`).
  # The smoke lane previously ran 3.12.13 while prod ran 3.14.7, so a
  # 3.14-only regression could pass the fast PR gate and only surface in the
  # heavy image lane. Aligned so the fast gate tests the interpreter prod uses.
  PYTHON_VERSION: "3.14.7"

# ──────────────────────────────────────────────────────────
# Tier 1: Cloud-safe smoke tests (no Milvus, no Postgres, no Ollama)
# 24 unit tests — extraction pipeline, pure Python, <30s
# ──────────────────────────────────────────────────────────
jobs:
  ui-tests:
    name: "SPA JS unit tests (§17.814)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: node --test (SPA util/components)
        run: node --test 'tests/ui/**/*.test.mjs'

  smoke:
    name: "Tier 1 · Smoke (unit tests)"
    runs-on: ubuntu-latest
    # §17.584 — raised 10→20: the smoke suite grew past the 10-min budget
    # (was timing out mid-run and canceling the job). ~681 tests at §17.102;
    # more now. 20 gives headroom without masking a genuine hang.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest==9.1.1 pytest-timeout==2.4.0 structlog==26.1.0

          # Install app dependencies needed by unit tests (no torch; pymilvus IS
          # in requirements-ci.txt — §17.854 audit H11 fixed the stale "no
          # pymilvus" note). The extraction tests import from app.modules.
          if [ -f requirements-ci.txt ]; then
            pip install -r requirements-ci.txt
          fi

      # §17.175 — OpenAPI drift gate. `make openapi-check` uses `docker exec`
      # (operator-only path); in CI we run the script directly since
      # requirements-ci.txt already brings in everything `from app.main import app`
      # needs. Catches contract drift before tests even run, so a developer who
      # adds an endpoint without regenerating docs/openapi.json sees a fast
      # focused failure rather than fishing through smoke output.
      #
      # If this step fails: `make openapi-snapshot` locally, review the diff,
      # bump app.version if the change is breaking, commit the regenerated
      # docs/openapi.json. See §17.174 for the §17.62 → §17.173 drift accident
      # this gate exists to prevent.
      - name: Verify OpenAPI snapshot matches live spec (§17.175)
        env:
          SCAFFOLD_API_KEY: "test-key-for-ci"
          PYTHONPATH: "."
        run: python scripts/openapi_snapshot.py --check

      # §17.395 — static-parity gate, consolidated into `make ci-tier-0`.
      # This is the SAME target the §17.393 pre-push hook runs, so local
      # pre-push, a bare `make ci-tier-0`, and this PR gate are provably
      # identical — no drift between what blocks a push and what blocks a PR.
      #
      # Bundles the four byte-equal/grep vendor gates that used to be
      # separate steps here:
      #   §17.186 check-schemas      — app/schemas.py → sdk/scaffold_client vendor
      #   §17.190 check-sse-events   — app/sse_events.py → pipelines/_vendor
      #   §17.195 check-next-actions — next_actions formatter vendor
      #   §17.245 check-rerank-drift — MODEL_RERANKER default across 3 sites
      # PLUS the two host static-scan pytest guards the per-gate steps never
      # ran (neither is `smoke`-marked, so `make ci-smoke` skips them):
      #   test_sse_event_inventory.py — every _sse("…") literal must be in
      #     ALL_EVENT_NAMES; this is the §17.392 class that slipped to a full
      #     `make test` because nothing fast caught it at push/PR time.
      #   test_sdk_schema_parity.py   — SDK vendor file-content parity.
      # No live services; runs in seconds. Live-schema drift (Milvus parity,
      # §17.319/§17.336) needs a live collection and stays in tier 2.
      #
      # On failure the make output names the failing sub-gate; the fix is the
      # matching `make sync-<x>` (schemas / sse-events / next-actions) then
      # commit the regenerated vendor file. `app/__init__.py` is empty and
      # app.sse_events is dep-free, so the pytest guards need no app deps.
      - name: Static-parity gate — ci-tier-0 (§17.393/§17.395)
        run: make ci-tier-0

      - name: Run ci-smoke tests
        env:
          SCAFFOLD_API_KEY: "test-key-for-ci"
          # §17.206 — ``sdk`` added to PYTHONPATH so the SDK's
          # ``scaffold_client`` package resolves. Pre-§17.206 only ``.``
          # was set, which made ``from scaffold_client.next_actions
          # import …`` (the §17.195 formatter test) fail at collection
          # with ``ModuleNotFoundError: No module named 'scaffold_client'``.
          # In the dev image the SDK is on sys.path via editable install;
          # cloud-CI doesn't run that install step.
          PYTHONPATH: ".:sdk"
          # §17.177 — also set explicitly here (Makefile sets it too) so
          # an operator reading ci.yml sees why the reranker prewarm is
          # off in CI without having to grep the Makefile. The prewarm
          # stalls cloud CI on cold HF download; reranker has no role
          # in smoke tests anyway.
          SCAFFOLD_PREWARM_RERANKER: "false"
        # §17.828 (plan 7.5) — tee the output so the skip-count step below can
        # read the pytest summary line. pipefail keeps make's exit code the
        # step's result (GH's default `bash -e` has no pipefail).
        run: |
          set -o pipefail
          make ci-smoke 2>&1 | tee /tmp/ci-smoke.out

      # §17.828 (plan 7.5) — surface the pytest result line in the job summary
      # and warn loudly if the skip count jumps. Skips grow silently (a
      # collect_ignore addition, a new module-level pytest.skip, a fixture
      # environment probe going dark) and nothing else watches the number:
      # observed baseline is 2 skipped (2026-08-25). The threshold is
      # deliberately loose — it exists to catch a JUMP, not to break on +1.
      - name: Report skip count (§17.828)
        if: always()
        env:
          SKIP_ALERT_MAX: "10"
        run: |
          line=$(grep -oE '[0-9]+ passed[^=]*' /tmp/ci-smoke.out | tail -1 || true)
          echo "### ci-smoke pytest result" >> "$GITHUB_STEP_SUMMARY"
          echo "${line:-no pytest summary line found}" >> "$GITHUB_STEP_SUMMARY"
          skipped=$(echo "$line" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' || true)
          if [ "${skipped:-0}" -gt "$SKIP_ALERT_MAX" ]; then
            echo "::warning title=ci-smoke skip count jumped::${skipped} tests skipped (baseline 2, alert >${SKIP_ALERT_MAX}). Check for new collect_ignore entries / module-level skips."
          fi

  # ──────────────────────────────────────────────────────────
  # Dependency CVE scan (§17.534)
  # ──────────────────────────────────────────────────────────
  # pip-audit against the THREE pinned requirements files — the same set
  # `make audit` scans in the dev image, but run here cloud-side (no docker
  # exec) so a known-vulnerable dep blocks the PR instead of waiting for an
  # operator to remember `make audit`. Pins are strict (everything in compose
  # is digest-locked) so without an automated scan CVEs accrue silently.
  #
  # If this fails on an UNFIXABLE / accepted advisory, append an ignore to the
  # step below: `--ignore-vuln GHSA-xxxx-…` (same flag `make audit` ARGS uses).
  # Document why in the commit. Dependabot (§17.534, .github/dependabot.yml)
  # opens the PRs that clear these.
  security:
    name: "Dependency CVE scan (pip-audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: pip-audit (requirements.txt, requirements-ci.txt, requirements-dev.txt)
        # §17.585 — torch 2.10.0 carries PYSEC-2026-139 + CVE-2025-3000 with NO
        # fixed release available (unfixable-upstream). torch is a required,
        # non-optional transitive of sentence-transformers (the CrossEncoder
        # reranker). Suppressed via --ignore-vuln (pip-audit's intended
        # mechanism for unfixable CVEs) so the gate reflects deps we can act on.
        # §17.812 (audit 1.6) — the suppressions now carry an EXPIRY: past
        # PIP_AUDIT_REVISIT this step fails, forcing a re-check for a patched
        # torch instead of the ignore living forever with no owner.
        run: |
          PIP_AUDIT_REVISIT="2026-11-01"
          today="$(date -u +%F)"
          echo "pip-audit CVE suppressions (expire $PIP_AUDIT_REVISIT): PYSEC-2026-139, CVE-2025-3000 — torch, unfixable-upstream (§17.585)"
          if [[ "$today" > "$PIP_AUDIT_REVISIT" ]]; then
            echo "::error::pip-audit ignore allowlist expired on $PIP_AUDIT_REVISIT. Re-check PYSEC-2026-139 / CVE-2025-3000 for a fixed torch, then refresh PIP_AUDIT_REVISIT."
            exit 1
          fi
          for f in requirements.txt requirements-ci.txt requirements-dev.txt; do
            printf '\n== pip-audit -r %s ==\n' "$f"
            pip-audit --strict -r "$f" \
              --ignore-vuln PYSEC-2026-139 \
              --ignore-vuln CVE-2025-3000
          done

  # ──────────────────────────────────────────────────────────
  # Tier 2: full-stack integration (§17.247)
  # ──────────────────────────────────────────────────────────
  # §17.397 — gated behind the `RUN_TIER2_INTEGRATION` repo variable.
  # With `runs-on: self-hosted` and NO runner registered to this repo, a
  # job whose `if:` is true does NOT sit "dormant" — it QUEUES forever and
  # leaves the whole run perpetually in-progress (observed: a Tier 2 job
  # queued ~17h because the host's runner is bound to a different repo).
  # The repo-variable gate makes the job SKIP (clean, instant) until both
  # (a) a self-hosted runner serves this repo and (b) someone opts in:
  #     gh variable set RUN_TIER2_INTEGRATION --body true
  # Unset / anything-but-"true" → skipped, so smoke (ubuntu-latest) is the
  # effective gate and the run completes green. Tier 1 is never blocked.
  #
  # The work itself is bundled in `make ci-tier-2` (Makefile, §17.247)
  # so an operator can run the SAME sequence locally before pushing:
  #   make ci-tier-2
  # Steps:
  #   1. orchestrator /health probe
  #   2. make doctor (whole-cloth — all 12 sections)
  #   3. make check-rerank-drift (redundant with tier 1; cheap)
  #   4. golden retrieval sidecar (~6-8 min wall) — emits coverage
  #
  # Requires: live compose stack + scaffold-engine_hf-cache populated
  # (the harness pre-flight probes §17.240-§17.242 catch missing
  # state before any sidecar fires).
  integration:
    name: "Tier 2 · Full-stack integration (§17.247)"
    runs-on: self-hosted
    if: vars.RUN_TIER2_INTEGRATION == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: smoke
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Rebuild orchestrator with PR code
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build scaffold-orchestrator

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::orchestrator failed to become healthy within 60 s"
          exit 1

      - name: Run tier 2 integration suite
        env:
          SCAFFOLD_API_KEY: ${{ secrets.SCAFFOLD_API_KEY }}
        run: make ci-tier-2
