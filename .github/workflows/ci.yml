  #         docker ps | grep -q scaffold-postgres     || { echo "::error::scaffold-postgres not running"; exit 1; }
  #         curl -sf http://localhost:8000/health > /dev/null || { echo "::error::orchestrator health check failed"; exit 1; }
  #
  #     - name: Rebuild orchestrator with latest code
  #       run: docker compose up -d --build scaffold-orchestrator
