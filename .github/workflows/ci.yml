# Scaffold Engine CI
# ──────────────────────────────────────────────────────────
# Tier 1 (ci-smoke)  → every push & PR   → GitHub cloud runners  → no live services
# Tier 2 (validate)  → main merges only  → self-hosted / local   → full Docker stack
# Tier 1 budget: 10 min wall (~681 smoke tests post-§17.102; ~8 min local).
# ──────────────────────────────────────────────────────────
# See docs/CI.md for the full tier breakdown and local testing with `act`.

name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12.13"

# ──────────────────────────────────────────────────────────
# Tier 1: Cloud-safe smoke tests (no Milvus, no Postgres, no Ollama)
# 24 unit tests — extraction pipeline, pure Python, <30s
# ──────────────────────────────────────────────────────────
jobs:
  smoke:
    name: "Tier 1 · Smoke (unit tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout structlog

          # Install app dependencies needed by unit tests (no torch, no pymilvus)
          # The extraction tests import from app.modules — install the minimal set
          if [ -f requirements-ci.txt ]; then
            pip install -r requirements-ci.txt
          fi

      # §17.175 — OpenAPI drift gate. `make openapi-check` uses `docker exec`
      # (operator-only path); in CI we run the script directly since
      # requirements-ci.txt already brings in everything `from app.main import app`
      # needs. Catches contract drift before tests even run, so a developer who
      # adds an endpoint without regenerating docs/openapi.json sees a fast
      # focused failure rather than fishing through smoke output.
      #
      # If this step fails: `make openapi-snapshot` locally, review the diff,
      # bump app.version if the change is breaking, commit the regenerated
      # docs/openapi.json. See §17.174 for the §17.62 → §17.173 drift accident
      # this gate exists to prevent.
      - name: Verify OpenAPI snapshot matches live spec (§17.175)
        env:
          SCAFFOLD_API_KEY: "test-key-for-ci"
          PYTHONPATH: "."
        run: python scripts/openapi_snapshot.py --check

      # §17.186 — Schemas-in-sync drift gate. `app/schemas.py` is vendored
      # into `sdk/scaffold_client/schemas.py` (byte-equal copy) so `pip
      # install scaffold-engine-client` works without the orchestrator's
      # runtime deps. A developer that edits the source without running
      # `make sync-schemas` ships a client that mis-serializes against the
      # current orchestrator. The §17.157 catch-up was triggered by exactly
      # this drift accumulating across §17.143-§17.156; §17.186 makes the
      # gate explicit and fast (zero-cost `diff`, runs before smoke tests).
      #
      # If this step fails: `make sync-schemas` locally, review the diff,
      # commit the regenerated sdk/scaffold_client/schemas.py.
      - name: Verify SDK schemas vendor is in sync (§17.186)
        run: make check-schemas

      # §17.190 — SSE-event constants drift gate. app/sse_events.py is the
      # canonical event-name vocabulary; pipelines/_vendor/_sse_events.py is the
      # byte-equal vendor that the OWUI pipelines container imports. Same
      # rationale as §17.186: a developer who edits one side without the
      # other ships a router that matches against names the orchestrator
      # no longer emits (the §17.190 audit found exactly this drift in
      # the pre-§17.190 scaffold_router.py).
      - name: Verify SSE-event constants vendor is in sync (§17.190)
        run: make check-sse-events

      # §17.195 — next_actions formatter vendor gate. sdk/scaffold_client/
      # next_actions.py is the source; pipelines/_vendor/_next_actions.py is the
      # byte-equal vendor imported by the OWUI pipeline. Same rationale as
      # §17.186 / §17.190: a developer editing one side without the other
      # ships a router that renders next_actions differently from the CLI/SDK.
      - name: Verify next_actions vendor is in sync (§17.195)
        run: make check-next-actions

      # §17.246 — gate on MODEL_RERANKER default alignment across the
      # 3 sites it ships at. Same logic as `make doctor` section 12
      # (§17.245), but file-only so it runs on a stock CI runner
      # without a docker compose stack. Catches drift at PR time,
      # not just at next operator `make doctor`.
      - name: Verify MODEL_RERANKER default agrees across 3 sites (§17.245)
        run: make check-rerank-drift

      - name: Run ci-smoke tests
        env:
          SCAFFOLD_API_KEY: "test-key-for-ci"
          # §17.206 — ``sdk`` added to PYTHONPATH so the SDK's
          # ``scaffold_client`` package resolves. Pre-§17.206 only ``.``
          # was set, which made ``from scaffold_client.next_actions
          # import …`` (the §17.195 formatter test) fail at collection
          # with ``ModuleNotFoundError: No module named 'scaffold_client'``.
          # In the dev image the SDK is on sys.path via editable install;
          # cloud-CI doesn't run that install step.
          PYTHONPATH: ".:sdk"
          # §17.177 — also set explicitly here (Makefile sets it too) so
          # an operator reading ci.yml sees why the reranker prewarm is
          # off in CI without having to grep the Makefile. The prewarm
          # stalls cloud CI on cold HF download; reranker has no role
          # in smoke tests anyway.
          SCAFFOLD_PREWARM_RERANKER: "false"
        run: make ci-smoke

  # ──────────────────────────────────────────────────────────
  # Tier 2: Integration + golden retrieval (requires full service stack)
  # ──────────────────────────────────────────────────────────
  # This job is DISABLED in GitHub cloud runners by default.
  # It requires Milvus 2.4.17 (8GB+ RAM), PostgreSQL, and Ollama.
  #
  # To run Tier 2:
  #   Option A: Local via `make ci-local` (uses docker exec, same as manual)
  #   Option B: Self-hosted runner with the full Docker stack pre-booted
  #   Option C: Local via `act -j integration` (see .actrc)
  #
  # Uncomment and configure a self-hosted runner to enable:
  #
  # integration:
  #   name: "Tier 2 · Integration + Golden"
