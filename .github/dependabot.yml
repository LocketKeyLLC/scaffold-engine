# §17.534 — automated dependency / image update PRs.
#
# Everything in this repo is strictly pinned (pip deps by ==version, all
# container images by @sha256 digest). That gives reproducibility but means a
# security patch never lands unless someone bumps the pin by hand. Dependabot
# closes that gap: it opens the PRs; the CI gates (pip-audit in ci.yml, the full
# test.yml suite, ci-tier-0) prove each bump before it merges.
#
# Grouped + weekly to keep PR volume low. Raise a group's limit or split a
# package out only if a bump needs isolated review.
version: 2
updates:
  # ── Python deps — root requirements{,-dev,-ci}.txt ───────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # trafilatura 2.2.0 drops <h1> section headings from txt/markdown extraction
      # (verified 2026-08-24: `<h1>Installation</h1>` disappears, code blocks duplicate),
      # which strips titles from every ingested HF/web doc chunk — a corpus-wide
      # content-quality regression, not a brittle test. Held at 2.1.x until the
      # heading-preserving extraction upgrade lands (audit M12 / plan Phase 8).
      - dependency-name: "trafilatura"
        versions: [">=2.2.0"]

  # ── Python deps — the four harness sidecars (docker/<name>/requirements.txt)
  - package-ecosystem: "pip"
    directories:
      - "/docker/ngspice"
      - "/docker/verilator"
      - "/docker/symbiyosys"
      - "/docker/coderunner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(sidecar)"
    # §17.905 — the same fix §17.904 gave the docker block, which that change
    # should have covered and didn't: this block also lists four directories
    # with no `groups:`, so one bump becomes one PR PER SIDECAR. Proven the very
    # next run — a single pydantic 2.13.4 -> 2.13.5 opened #349, #350, #351 and
    # #352, four PRs for one version, while the grouped docker block correctly
    # produced one (#348) and the grouped root-pip block one (#353).
    #
    # The four sidecars pin the same small set of shared deps and are rebuilt
    # together, so a bump that lands in one but not the others is a state
    # nobody wants — grouping is how they stay in lockstep.
    groups:
      sidecar-deps:
        patterns: ["*"]

  # ── Container base images — Dockerfile + docker-compose.yml digest pins ───
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/ngspice"
      - "/docker/verilator"
      - "/docker/symbiyosys"
      - "/docker/coderunner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"
    # §17.904 — group the base-image digest bumps. Without this, dependabot
    # opens one PR PER DIRECTORY, so a single `python:3.14.7-slim` digest roll
    # became five identical PRs (#332-#336, all `ce40764` -> `cae66f2`) that had
    # to be reviewed, gated and closed five times. Every directory here pins the
    # SAME python base, so they move together or not at all — reviewing them
    # apart is busywork with a real cost on a metered runner. The pip ecosystem
    # above has grouped minor/patch since §17.534 for exactly this reason; the
    # docker one was simply never given the same treatment.
    groups:
      docker-base-images:
        patterns: ["*"]

  # ── GitHub Actions used by the three workflows ───────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(actions)"
